[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kzp-lab06-vetclinic"
version = "6.0.0"
description = "LAB 06 Python CSV data processing for veterinary clinic"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "build>=1.2",
]

[project.scripts]
kzp-lab06 = "kzp_lab06.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = [
    "build",
    "dist",
    ".venv",
    ".venv-wheel",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
